<!--# Вкладка 'Общее'. #-->
<link rel="stylesheet" href="../templates/yandexhome/css/bootstrap-select.min.css">

<form action="?" method="post" enctype="multipart/form-data" name="frmEdit" class="form-horizontal">
   <fieldset>
      [#if OK#]
         <div class="alert alert-success" role="alert"><#LANG_DATA_SAVED#></div>
      [#endif OK#]
      [#if ERR#]
         <div class="alert alert-danger" role="alert"><#LANG_FILLOUT_REQURED#></div>
      [#endif ERR#]
      <!--# Название устройства (обязательное поле). #-->
      <div class="form-group">
         <label class="col-lg-3 control-label"[#if ERR_TITLE#] style="color:red;font-weight:bold"[#endif#]>
            <#LANG_TITLE#> (*):
         </label>
         <div class="col-lg-4">
            <input type="text" class="form-control" name="title" value="[#TITLE#]" id="title"[#if ERR_TITLE#] placeholder="Укажите название устройства!"[#endif#]>
         </div>
      </div>
      <!--# Тип устройства (обязательное поле). #-->

         <label class="col-lg-3 control-label"><#LANG_TYPE#> (*):</label>
         <div class="col-lg-4">
            <select name="type" id="select_device" class="selectpicker show-tick form-control">
            <optgroup label="Освещение">
            [#begin DEVICES_TYPE#]
            [#if device_name=="socket"#]</optgroup><optgroup label="Электрика">[#endif#]
            [#if device_name=="thermostat"#]</optgroup><optgroup label="Климат">[#endif#]
            [#if device_name=="media_device"#]</optgroup><optgroup label="Медиа">[#endif#]
            [#if device_name=="cooking"#]</optgroup><optgroup label="Техника">[#endif#]
            [#if device_name=="openable"#]</optgroup><optgroup label="Открывание и доступ">[#endif#]
            [#if device_name=="sensor"#]</optgroup><optgroup label="Датчики">[#endif#]
            [#if device_name=="smart_meter"#]</optgroup><optgroup label="Счетчики">[#endif#]
            [#if device_name=="pet_drinking_fountain"#]</optgroup><optgroup label="Питомцы">[#endif#]
            [#if device_name=="other"#]</optgroup><optgroup label="Другое">[#endif#]
            <option data-content="<img src='../templates/yandexhome/img/[#icon_webp_name#].webp' width='20' height='20' onerror='this.onerror=null;this.src=&quot;../templates/yandexhome/img/[#icon_name#].svg&quot;;this.onerror=function(){this.src=&quot;../img/modules/yandexhome.png&quot;;};'>&nbsp;&nbsp;[#description#]" value="[#device_name#]" [#if device_name="<#TYPE#>"#] selected[#endif#]></option>
            [#end DEVICES_TYPE#]
            </optgroup>
            </select>
         </div>
      </div>
      <!--# Местоположение устройства. #-->
      <div class="form-group">
         <label class="col-lg-3 control-label"><#LANG_LOCATION#>:</label>
         <div class="col-lg-4">
            <select name="location" class="form-control">
               <option value=""></option>
               [#begin LOCATIONS#]
               <option value="[#TITLE#]" [#if TITLE="<#ROOM#>"#] selected[#endif#]>[#TITLE#]</option>
               [#end LOCATIONS#]
            </select>
         </div>
      </div>
      <!--# Описание устройства. #-->
      <div class="form-group">
         <label class="col-lg-3 control-label">Описание устройства:</label>
         <div class="col-lg-4">
            <input type="text" class="form-control" name="description" value="[#DESCRIPTION#]" id="description">
         </div>
      </div>
      <!--# Производитель устройства. #-->
      <div class="form-group">
         <label class="col-lg-3 control-label">Производитель устройства:</label>
         <div class="col-lg-4">
            <input type="text" class="form-control" name="manufacturer" value="[#MANUFACTURER#]" id="manufacturer">
         </div>
      </div>
      <!--# Модель устройства. #-->
      <div class="form-group">
         <label class="col-lg-3 control-label">Модель устройства:</label>
         <div class="col-lg-4">
            <input type="text" class="form-control" name="model" value="[#MODEL#]" id="model">
         </div>
      </div>
      <!--# Версия ПО устройства. #-->
      <div class="form-group">
         <label class="col-lg-3 control-label">Версия ПО:</label>
         <div class="col-lg-4">
            <input type="text" class="form-control" name="sw_version" value="[#SW_VERSION#]" id="sw_version">
         </div>
      </div>
      <!--# Версия АО устройства. #-->
      <div class="form-group">
         <label class="col-lg-3 control-label">Версия АО:</label>
         <div class="col-lg-4">
            <input type="text" class="form-control" name="hw_version" value="[#HW_VERSION#]" id="hw_version">
         </div>
      </div>
      <!--# Атрибуты устройства (обязательное поле). #-->
      <div class="form-group">
         <label class="col-lg-3 control-label"[#if ERR_TRAITS#] style="color:red;font-weight:bold"[#endif#]>
            Характеристики (*):<br>(возможности, умения)
         </label>
         <div class="col-lg-4">
            <div class="input-group">
               <select id="select_trait" class="selectpicker form-control" title="Ничего не выбрано...">
                  <option data-content="" value=""></option>
                  <optgroup label="Управление: Вкл/Выкл">
                  [#begin DEVICES_INSTANCE#]
                  [#if instance_name=="backlight"#]</optgroup><optgroup label="Управление: Переключатели (toggle)">[#endif#]
                  [#if instance_name=="brightness"#]</optgroup><optgroup label="Управление: Диапазоны (range)">[#endif#]
                  [#if instance_name=="cleanup_mode"#]</optgroup><optgroup label="Управление: Режимы (mode)">[#endif#]
                  [#if instance_name=="rgb"#]</optgroup><optgroup label="Управление: Цвет (color_setting)">[#endif#]
                  [#if instance_name=="video_stream"#]</optgroup><optgroup label="Камера: Видеопоток">[#endif#]
                  [#if instance_name=="amperage_sensor"#]</optgroup><optgroup label="Датчики: Числовые (float)">[#endif#]
                  [#if instance_name=="vibration_sensor"#]</optgroup><optgroup label="Датчики: События (event)">[#endif#]
                  <option data-content="[#description#] ([#instance_name#] / [#capability#])" description="[#description#]" value="[#instance_name#]"></option>
                  [#end DEVICES_INSTANCE#]
                  </optgroup>
               </select>
               <span class="input-group-btn">
                  <button class="btn btn-default" type="button" onclick="addTrait();"><i class="glyphicon glyphicon-plus"></i></button>
               </span>
            </div>
         </div>
      </div>
      <div class="form-group">
         <label class="col-lg-3 control-label"></label>
         <div class="col-lg-4">
            <div id="traits_table" class="yh-traits-list"></div>
            <input type="hidden" name="traits_json" id="traits_json" value="{}">
            <input type="hidden" name="instance_json" id="instance_json" value="{}">
         </div>
      </div>
      <div class="form-group">
         <div class="col-lg-offset-3 col-lg-4">
            <button type="submit" name="subm" value="Submit" class="btn btn-primary"><#LANG_SUBMIT#></button>
            <a href="?" class="btn btn-default "><#LANG_STRING_BACK#></a>
            <input type="hidden" name="id" value="<#ID#>">
            <input type="hidden" name="view_mode" value="<#VIEW_MODE#>">
            <input type="hidden" name="mode" value="update">
         </div>
      </div>
   </fieldset>
</form>

<div>
   <pre id="objects_json" style="display:none;">[#OBJECTS#]</pre>
   <pre id="value_map_presets_json" style="display:none;">[#VALUE_MAP_PRESETS_JSON#]</pre>

   <!--# <pre>[#TRAITS#]</pre> #-->
</div>

<style>
.popover {
   max-width: 250px;
}
</style>

<script type="text/javascript">

var script = document.createElement('script');
script.src = 'templates/yandexhome/css/bootstrap-select.min.js';
script.type = 'text/javascript';
document.body.appendChild(script);

//console.log('start');

var traits_list = {};
var objects_list = [];
var objects_options = '';
var instance_list = {};
var value_map_presets = {};

var isPopover = false;

function asBool(value) {
   if (typeof value === 'boolean') return value;
   if (typeof value === 'number') return value !== 0;
   if (typeof value === 'string') {
      let v = value.toLowerCase().trim();
      return (v === '1' || v === 'true' || v === 'yes' || v === 'on');
   }
   return !!value;
}

// Получаем список метрик в формате JSON.
var traits_json = '[#TRAITS#]';

// Получаем список метрик в формате JSON.
var objects_json = $('#objects_json').text();
var value_map_presets_json = $('#value_map_presets_json').text();

// Получаем массив поддерживаемых умений.
var instance_list = tryParseJSON('[#DEVICES_INSTANCE_JSON#]');
saveInstanceList();
if (value_map_presets_json !== '') {
   let parsed_presets = tryParseJSON(value_map_presets_json);
   if (parsed_presets !== false) {
      value_map_presets = parsed_presets;
   }
}

// Получаем конфиг устройства в формате JSON.
var dev_config = tryParseJSON('[#CONFIG#]');

script.onload = function() {
   // После подгрузки js-файла перерисуем элементы select.
   $('.selectpicker').selectpicker('render');

   if (objects_json !== '') {
      var objects = tryParseJSON(objects_json);
      if (objects !== false) {
         if (objects.length > 0) {
            for (key in objects) {
               if (objects[key].DESCRIPTION != '' && objects[key].DESCRIPTION != null) {
                  let description = escapeHtml(objects[key].DESCRIPTION);
                  objects_options += '<option style="white-space: normal;" data-subtext="'+description+'" value="'+objects[key].TITLE+'">'+objects[key].TITLE+'</option>';
               } else {
                  objects_options += '<option style="white-space: normal;" data-content="'+objects[key].TITLE+'" value="'+objects[key].TITLE+'"></option>';
               }
            }
         }
      }
   }

   if (traits_json !== '') {
      var traits = tryParseJSON(traits_json);
      if (traits !== false) {
         traits_list = traits;
        for (const traitKey in traits_list) {
            if (!traits_list.hasOwnProperty(traitKey)) continue;
            if (typeof(traits_list[traitKey].value_map_preset) === 'undefined') {
               traits_list[traitKey].value_map_preset = (traits_list[traitKey].type === 'on') ? 'bool_onoff_10' : 'none';
            }
            if (typeof(traits_list[traitKey].value_map) === 'undefined' || traits_list[traitKey].value_map === null) {
               if (traits_list[traitKey].type === 'on') {
                  traits_list[traitKey].value_map = {'1':'on','0':'off','true':'on','false':'off'};
               } else {
                  traits_list[traitKey].value_map = {};
               }
            }
            traits_list[traitKey].reportable = asBool(traits_list[traitKey].reportable);
         }
         refreshTraitsSelectDisabled();
         // Формируем и выводим таблицу метрик.
         renderTraitsTable();
         saveTraitsList();
      }
   }

   if (dev_config !== '' && dev_config !== false) {
      let capabilities = (dev_config && dev_config.capabilities) ? dev_config.capabilities : [];
      if (capabilities.length > 0) {
         for (key in capabilities) {
            if (typeof(capabilities[key].parameters) != 'undefined' && typeof(capabilities[key].parameters.instance) != 'undefined' && capabilities[key].parameters.instance !== null && typeof(instance_list[capabilities[key].parameters.instance]) != 'undefined') {
               let linked_type = capabilities[key].parameters.instance;
               if (instance_list[linked_type].capability === 'range') {
                  if (typeof(capabilities[key].parameters.range) != 'undefined' && capabilities[key].parameters.range !== null) {
                     min_value = capabilities[key].parameters.range['min'];
                     max_value = capabilities[key].parameters.range['max'];
                     precision_value = capabilities[key].parameters.range['precision'];
                     instance_list[linked_type].parameters.range['min'] = min_value;
                     instance_list[linked_type].parameters.range['max'] = max_value;
                     instance_list[linked_type].parameters.range['precision'] = precision_value;
                  }
               }
               if (instance_list[linked_type].capability === 'on_off') {
                  if (typeof(capabilities[key].parameters['split']) != 'undefined' && capabilities[key].parameters['split'] !== null) {
                     split = capabilities[key].parameters['split'];
                     instance_list[linked_type].parameters['split'] = split;
                  }
               }
            }
         }
         saveInstanceList();
      }
   }

   $('body').popover({
      selector: '.popover_instance',
      container: 'body',
      placement: 'top',
      html: true
   });

   //console.log('stop');
}

//Доделано SmoKE xD, я сам нихера не понимаю, что тут написано, но работает!
//London тоже руку приложил, тож нихера не понял

function addReportable(prop_name,split = false) {
   let traits = traits_list;
   if (typeof(traits[prop_name]) === 'undefined') {
      return;
   }
   let instance = instance_list;
   if (!split) {
      traits[prop_name]['reportable'] = !asBool(traits[prop_name]['reportable']);
      if (prop_name == 'on' && traits[prop_name]['reportable'] && instance[prop_name] && instance[prop_name]['parameters'] && instance[prop_name]['parameters']['split']) {
         instance[prop_name]['parameters']['split'] = false;
      }
   } else if (prop_name == 'on') {
      if (!instance[prop_name] || !instance[prop_name]['parameters']) {
         return;
      }
      instance[prop_name]['parameters']['split'] = !asBool(instance[prop_name]['parameters']['split']);
      if (instance[prop_name]['parameters']['split'] && asBool(traits[prop_name]['reportable'])) {
         traits[prop_name]['reportable'] = false;
      }
   }
   traits_list = traits;
   instance_list = instance;
   saveTraitsList();
   saveInstanceList();
   renderTraitsTable();
}

function renderTraitsTable() {
   $('#traits_table').empty();
   isPopover = false;
   for (key in traits_list) {
      if (traits_list.hasOwnProperty(key)) {
         let linked_type = traits_list[key].type;
         let linked_object = traits_list[key].linked_object;
         let linked_property = traits_list[key].linked_property;
         let linked_description = traits_list[key].description;
         let reportable = asBool(traits_list[key].reportable);
         let split = false;
         if (key == 'on') {
           let capabilities = (dev_config && dev_config.capabilities) ? dev_config.capabilities : [];
           if (capabilities.length > 0) {
             for (key2 in capabilities) {
                if (typeof(capabilities[key2].parameters) != 'undefined' && typeof(capabilities[key2].parameters.instance) != 'undefined' && capabilities[key2].parameters.instance !== null && typeof(instance_list[capabilities[key2].parameters.instance]) != 'undefined') {
                   let linked_type = capabilities[key2].parameters.instance;
                   if (instance_list[linked_type].capability === 'on_off') {
                      if (typeof(capabilities[key2].parameters['split']) != 'undefined' && capabilities[key2].parameters['split'] !== null) {
                         split = capabilities[key2].parameters['split'];
                         instance_list[linked_type].parameters['split'] = split;
                      }
                   }
                }
             }
           }
         }
         // Формируем строки в таблице метрик.
         addTraitRow(linked_type, linked_description, linked_object, linked_property, reportable, split);
         objects_list[linked_object] = '';
      }
   }
   if (isPopover) {
      initPopovers();
   }
}

function renderPropertySelectbox(id, object = '', selected = '') {
   $('#' + id).selectpicker('refresh');
   if (object !== '') {
      if (objects_list[object] !== undefined && objects_list[object] !== '') {
         $('#' + id).append(objects_list[object]);
         $('#' + id).selectpicker('refresh');
         if (selected !== '') {
            $('#' + id).selectpicker('val', selected);
         }
      } else {
         url = '<#ROOTHTML#>panel/linkedobject.html?ajax=1&op=properties';
         url += '&object='+object;
         $.get(url, function(props) {
            if (props.PROPERTIES.length > 0) {
               let optionsAsString = '<option data-content="" value=""></option>';
               props = props.PROPERTIES;
               for (key in props) {
                  if (props[key].DESCRIPTION != '' && props[key].DESCRIPTION != null) {
                     let description = escapeHtml(props[key].DESCRIPTION);
                     optionsAsString += '<option style="white-space: normal;" data-subtext="'+description+'" value="'+props[key].TITLE+'">'+props[key].TITLE+'</option>';
                  } else {
                     optionsAsString += '<option style="white-space: normal;" data-content="'+props[key].TITLE+'" value="'+props[key].TITLE+'"></option>';
                  }
               }
               $('#' + id).append(optionsAsString);
               $('#' + id).selectpicker('refresh');
               if (selected !== '') {
                  $('#' + id).selectpicker('val', selected);
               }
               objects_list[object] = optionsAsString;
            }
         });
      }
   }
}

function renderObjectSelectbox(id, selected = '') {
   $('#' + id).append(objects_options);
   $('#' + id).selectpicker('refresh');
   if (selected !== '') {
      $('#' + id).selectpicker('val', selected);
   }
}

function refreshTraitsSelectDisabled() {
   $('#select_trait option').prop('disabled', false);
   for (key in traits_list) {
      if (traits_list.hasOwnProperty(key)) {
         $('#select_trait').find('[value=' + traits_list[key].type + ']').prop('disabled', true);
      }
   }
   $('#select_trait').selectpicker('refresh');
}

function getTraitTypeOptionsHtml(current_type) {
   let html = '<option value=""></option>';
   $('#select_trait option').each(function() {
      let value = $(this).val();
      if (!value) {
         return;
      }
      let description = $(this).attr('description') || $(this).text() || value;
      let selected = (value === current_type) ? ' selected' : '';
      let disabled = (value !== current_type && typeof(traits_list[value]) !== 'undefined') ? ' disabled' : '';
      html += '<option value="' + value + '"' + selected + disabled + '>' + description + ' (' + value + ')</option>';
   });
   return html;
}

function getValueMapPresetOptionsHtml(current_preset) {
   let html = '';
   for (const preset_id in value_map_presets) {
      if (!value_map_presets.hasOwnProperty(preset_id)) continue;
      let label = value_map_presets[preset_id].label || preset_id;
      let selected = (preset_id === current_preset) ? ' selected' : '';
      html += '<option value="' + preset_id + '"' + selected + '>' + label + '</option>';
   }
   return html;
}

function getAllowedYandexValues(trait_type) {
   let def = instance_list[trait_type];
   if (def && typeof(def) === 'object') {
      if (def.capability === 'mode' && def.parameters && Array.isArray(def.parameters.modes)) {
         let modeValues = [];
         for (let i = 0; i < def.parameters.modes.length; i++) {
            let item = def.parameters.modes[i];
            if (item && typeof(item.value) !== 'undefined') {
               modeValues.push(String(item.value));
            }
         }
         if (modeValues.length > 0) return modeValues;
      }

      if (def.capability === 'event' && def.parameters && Array.isArray(def.parameters.events)) {
         let eventValues = [];
         for (let i = 0; i < def.parameters.events.length; i++) {
            let item = def.parameters.events[i];
            if (item && typeof(item.value) !== 'undefined') {
               eventValues.push(String(item.value));
            }
         }
         if (eventValues.length > 0) return eventValues;
      }

      if (def.capability === 'toggle' || def.capability === 'on_off') {
         return ['true', 'false', 'on', 'off', '1', '0'];
      }
   }

   // Fallback for traits without explicit enum list in structure.
   return ['opened', 'closed', 'detected', 'not_detected', 'leak', 'dry', 'click', 'double_click', 'long_press', 'low', 'normal', 'empty', 'on', 'off', 'true', 'false'];
}

function getYandexValueOptionsHtml(trait_type, selected_value) {
   let values = getAllowedYandexValues(trait_type);
   let html = '<option value=""></option>';
   for (let i = 0; i < values.length; i++) {
      let val = values[i];
      let selected = (val === selected_value) ? ' selected' : '';
      html += '<option value="' + val + '"' + selected + '>' + val + '</option>';
   }
   return html;
}

function renderValueMapEditor(trait_type) {
   let container = $('#value_map_editor_' + trait_type);
   container.empty();
   if (typeof(traits_list[trait_type]) === 'undefined') return;
   let editorField = container.closest('.yh-trait-map-editor-field');
   if (traits_list[trait_type].value_map_preset !== 'custom') {
      editorField.hide();
      return;
   }
   editorField.show();

   if (!traits_list[trait_type].value_map || typeof(traits_list[trait_type].value_map) !== 'object') {
      traits_list[trait_type].value_map = {};
   }

   let map = traits_list[trait_type].value_map;
   let keys = Object.keys(map);

   let header = $('<div class="yh-map-header"><div>MJDM</div><div>Yandex</div><div></div></div>');
   container.append(header);

   for (let i = 0; i < keys.length; i++) {
      let src = keys[i];
      let dst = map[src];
      let row = $('<div class="yh-map-row"></div>');
      row.append('<input type="text" class="form-control input-sm yh-map-src" value="' + escapeHtml(src) + '" data-old-key="' + escapeHtml(src) + '">');
      row.append('<select class="selectpicker yh-map-dst" data-width="100%">' + getYandexValueOptionsHtml(trait_type, dst) + '</select>');
      row.append('<button type="button" class="btn btn-xs btn-default yh-map-del"><i class="glyphicon glyphicon-trash"></i></button>');
      container.append(row);
   }

   let addBtn = $('<button type="button" class="btn btn-xs btn-default yh-map-add"><i class="glyphicon glyphicon-plus"></i>&nbsp;Добавить соответствие</button>');
   container.append(addBtn);
   container.find('.selectpicker').selectpicker('render').selectpicker('refresh');

   container.find('.yh-map-add').off('click').on('click', function() {
      let row = $('<div class="yh-map-row"></div>');
      row.append('<input type="text" class="form-control input-sm yh-map-src" value="" data-old-key="">');
      row.append('<select class="selectpicker yh-map-dst" data-width="100%">' + getYandexValueOptionsHtml(trait_type, '') + '</select>');
      row.append('<button type="button" class="btn btn-xs btn-default yh-map-del"><i class="glyphicon glyphicon-trash"></i></button>');
      $(this).before(row);
      row.find('.selectpicker').selectpicker('render').selectpicker('refresh');
   });

   container.off('click', '.yh-map-del').on('click', '.yh-map-del', function() {
      $(this).closest('.yh-map-row').remove();
      collectValueMapFromEditor(trait_type);
   });

   container.off('change', '.yh-map-dst').on('change', '.yh-map-dst', function() {
      collectValueMapFromEditor(trait_type);
   });

   container.off('change', '.yh-map-src').on('change', '.yh-map-src', function() {
      collectValueMapFromEditor(trait_type);
   });
}

function collectValueMapFromEditor(trait_type) {
   let container = $('#value_map_editor_' + trait_type);
   if (typeof(traits_list[trait_type]) === 'undefined') return;
   let map = {};
   container.find('.yh-map-row').each(function() {
      let src = ($(this).find('.yh-map-src').val() || '').toString().trim().toLowerCase();
      let dst = ($(this).find('.yh-map-dst').val() || '').toString().trim();
      if (src !== '' && dst !== '') {
         map[src] = dst;
      }
   });
   traits_list[trait_type].value_map = map;
   saveTraitsList();
}

function changeTraitValueMapPreset(trait_type, preset_id) {
   if (typeof(traits_list[trait_type]) === 'undefined') {
      return;
   }
   if (typeof(value_map_presets[preset_id]) === 'undefined') {
      preset_id = 'none';
   }

   traits_list[trait_type].value_map_preset = preset_id;
   if (preset_id !== 'custom') {
      let preset_map = value_map_presets[preset_id] && value_map_presets[preset_id].map ? value_map_presets[preset_id].map : {};
      let normalized_map = {};
      for (const src in preset_map) {
         if (!preset_map.hasOwnProperty(src)) continue;
         normalized_map[String(src).toLowerCase()] = preset_map[src];
      }
      traits_list[trait_type].value_map = normalized_map;
   }
   saveTraitsList();
   renderValueMapEditor(trait_type);
}

function changeTraitType(old_type, new_type) {
   if (!new_type || old_type === new_type) {
      return;
   }
   if (typeof(traits_list[old_type]) === 'undefined') {
      return;
   }
   if (typeof(traits_list[new_type]) !== 'undefined') {
      alert('Этот тип уже добавлен');
      $('[id="trait_type_select_' + old_type + '"]').selectpicker('val', old_type);
      return;
   }

   let new_description = $('#select_trait option[value="' + new_type + '"]').attr('description') || new_type;
   let old_trait = traits_list[old_type];
   old_trait.type = new_type;
   old_trait.description = new_description;
   delete(traits_list[old_type]);
   traits_list[new_type] = old_trait;

   saveTraitsList();
   renderTraitsTable();
   refreshTraitsSelectDisabled();
}

function addTraitRow(linked_type, linked_description, linked_object, linked_property, reportable = false, split = false) {
   let card = $('<div id="trait_card_' + linked_type + '" class="yh-trait-card"></div>');
   $('#traits_table').append(card);

   let range_options = '';

   if (instance_list[linked_type].capability === 'range') {
      if (typeof(instance_list[linked_type].parameters) != 'undefined' && instance_list[linked_type].parameters !== null) {
         range_options =
         `<span id="options${linked_type}" data-instance="${linked_type}" class="btn btn-link popover_instance" style="max-width: 250px;" data-toggle="popover" title="Дополнительные опции" data-content=''><i class="glyphicon glyphicon-cog"></i></span>`;
         isPopover = true;
      }
   }

   let trait_type_options = getTraitTypeOptionsHtml(linked_type);
   let current_map_preset = (traits_list[linked_type] && traits_list[linked_type].value_map_preset) ? traits_list[linked_type].value_map_preset : 'none';
   let map_preset_options = getValueMapPresetOptionsHtml(current_map_preset);

   card.append($(`
      <div class="yh-trait-card-head">
         <div class="yh-trait-head-wrap">
            <div class="yh-trait-head-title">${linked_description}</div>
            <div class="yh-trait-head-controls">
               <select id="trait_type_select_${linked_type}" class="selectpicker yh-trait-type-select" data-width="340px" data-live-search="true" onchange="changeTraitType('${linked_type}', this.value);">${trait_type_options}</select>
               ${range_options}
            </div>
         </div>
      </div>
   `));

   card.append($(`<div class="yh-trait-card-body"><input type="hidden" class="form-control" name="trait_type" value="${linked_type}"></div>`));
   let bodyCell = card.find('.yh-trait-card-body');
   let mainRow = $('<div class="yh-trait-main-row"></div>');
   bodyCell.append(mainRow);

   // Привязанный объект.
   let objectSelect = $(`<select id="linked_object${linked_type}" name="linked_object${linked_type}" class="selectpicker" title="Выберите объект" data-live-search="true" data-width="100%" onChange="linkedObjectChaged('${linked_type}', this.value);"><option data-content="" value=""></option></select>`);
   let objectField = $('<div class="yh-trait-field"></div>').append('<div class="yh-trait-label">Объект</div>').append(objectSelect);
   mainRow.append(objectField);

   renderObjectSelectbox('linked_object' + linked_type, linked_object);

   // Привязанное свойство.
   let propSelect = $(`<select id="linked_property${linked_type}" name="linked_property${linked_type}" class="selectpicker" title="Укажите свойство" data-width="100%" onChange="linkedPropertyChaged('${linked_type}', this.value);"></select>`);
   let propField = $('<div class="yh-trait-field"></div>').append('<div class="yh-trait-label">Свойство</div>').append(propSelect);
   mainRow.append(propField);

   renderPropertySelectbox('linked_property' + linked_type, linked_object, linked_property);

   let mapPresetField = $('<div class="yh-trait-field yh-trait-map-field"></div>')
      .append('<div class="yh-trait-label">Соответствия MJDM -> Yandex</div>')
      .append($('<select id="value_map_preset_' + linked_type + '" class="selectpicker" data-width="100%" onchange="changeTraitValueMapPreset(\'' + linked_type + '\', this.value);">' + map_preset_options + '</select>'));
   bodyCell.append('<div class="yh-trait-map-hint alert alert-info">В MJDM и Яндекс значения могут храниться по-разному, поэтому тут можно настроить соответствие значений.</div>');
   bodyCell.append(mapPresetField);
   let mapEditorField = $('<div class="yh-trait-field yh-trait-map-editor-field"><div id="value_map_editor_' + linked_type + '" class="yh-map-editor"></div></div>');
   bodyCell.append(mapEditorField);

   let reportable_btn_class = reportable ? 'btn-success' : 'btn-default';
   let reportable_btn_text = reportable ? 'Репорт: Вкл' : 'Репорт: Выкл';

   let split_options = '';
   if (instance_list[linked_type].capability === 'on_off') {
//console.log(split);
      if (typeof(instance_list[linked_type].parameters) != 'undefined' && instance_list[linked_type].parameters !== null) {
         let split_btn_class = split ? 'btn-success' : 'btn-default';
         let split_btn_text = split ? 'Split: Вкл' : 'Split: Выкл';
         split_options =
         `<button type="button" title="Разделение кнопки на 2 отдельные Вкл/Выкл (доступно только при выключенном Reportable)" id="${linked_type}" class="btn btn-xs ${split_btn_class} splitBtn" onclick="addReportable($(this).attr('id'),true);"><i class="glyphicon glyphicon-sound-stereo"></i>&nbsp;${split_btn_text}</button>`;
      }
   }


   // Действия карточки.
   let actionsBlock = $(`<div class="yh-trait-actions"><div class="btn-group btn-group-xs" role="group"><button type="button" id="${linked_type}" class="btn btn-default" title="Удалить умение" onclick="deleteTrait($(this).attr('id'));"><i class="glyphicon glyphicon-trash"></i></button>[#if REPORTABLE_CONFIGURED="1"#]<button type="button" title="Система будет автоматически отправлять изменения в Яндекс. (Требуется настройка)" id="${linked_type}" class="btn ${reportable_btn_class} reportableBtn" onclick="addReportable($(this).attr('id'));"><i class="glyphicon glyphicon-retweet"></i></button>[#endif#]${split_options}</div></div>`);
   mainRow.append(actionsBlock);

   $('#trait_type_select_' + linked_type).selectpicker('render');
   $('#trait_type_select_' + linked_type).selectpicker('refresh');
   $('#value_map_preset_' + linked_type).selectpicker('render');
   $('#value_map_preset_' + linked_type).selectpicker('refresh');
   renderValueMapEditor(linked_type);
}

function addTrait() {
   // Считываем текущие значения из списка выбора метрик.
   let trait_type = $('#select_trait').val();
   let trait_description = $('#select_trait option:selected').attr('description');

   if (trait_type != '') {
      // Добавляем новый элемент в массив traits_list
      traits_list[trait_type] = {};
      traits_list[trait_type].type = trait_type;
      traits_list[trait_type].description = trait_description;
      traits_list[trait_type].linked_object = '';
      traits_list[trait_type].linked_property = '';
      traits_list[trait_type].reportable = false;
      if (trait_type === 'on') {
         traits_list[trait_type].value_map_preset = 'bool_onoff_10';
         traits_list[trait_type].value_map = {'1':'on','0':'off','true':'on','false':'off'};
      } else {
         traits_list[trait_type].value_map_preset = 'none';
         traits_list[trait_type].value_map = {};
      }
      saveTraitsList();

      isPopover = false;

      // Обновляем таблицу метрик.
      addTraitRow(trait_type, trait_description, '', '');

      if (isPopover) {
         initPopovers();
      }

      // Сбрасываем значение список выбора метрик на дефолтное (пустое).
      $('#select_trait').selectpicker('val', '');
      refreshTraitsSelectDisabled();
   }
}

function deleteTrait(trait_type) {
   // Удаляем карточку умения.
   $('#trait_card_' + trait_type).remove();

   // Удаляем элемент из массива traits_list
   delete(traits_list[trait_type]);
   saveTraitsList();

   refreshTraitsSelectDisabled();
}

function saveTraitsList() {
   $('#traits_json').val(JSON.stringify(traits_list));
}

function getInstanceOptions(linked_type, init) {

   let min_value = '';
   let max_value = '';
   let precision_value = '';

   if (instance_list[linked_type].capability === 'range') {
      if (typeof(instance_list[linked_type].parameters) != 'undefined' && instance_list[linked_type].parameters !== null) {
         min_value = instance_list[linked_type].parameters.range['min'];
         max_value = instance_list[linked_type].parameters.range['max'];
         precision_value = instance_list[linked_type].parameters.range['precision'];
      }
   }

   let optionsAsString = `
      <div class="input-group input-group-sm">
         <span class="input-group-addon" id="basic-addon1">Min&nbsp&nbsp</span>
         <input type="text" class="form-control" aria-describedby="basic-addon1" id="min_value${linked_type}" value="${min_value}">
      </div>
      <div style="line-height: 50%;">&nbsp</div>
      <div class="input-group input-group-sm">
         <span class="input-group-addon" id="basic-addon2">Max&nbsp</span>
         <input type="text" class="form-control" aria-describedby="basic-addon2" id="max_value${linked_type}" value="${max_value}">
      </div>
      <div style="line-height: 50%;">&nbsp</div>
      <div class="input-group input-group-sm">
         <span class="input-group-addon" id="basic-addon3">Step</span>
         <input type="text" class="form-control" aria-describedby="basic-addon3" id="precision_value${linked_type}" value="${precision_value}">
      </div>
      <div style="line-height: 50%;">&nbsp</div>
      <div class="text-center">
         <span id="${linked_type}" class="btn btn-success btn-sm" onclick="saveInstanceOptions(this);"><i class="glyphicon glyphicon-ok"></i></span>&nbsp
         <span id="${linked_type}" class="btn btn-default btn-sm" onclick="closePopover(this);"><i class="glyphicon glyphicon-remove"></i></span>
      </div>`;

   return optionsAsString;
}

function saveInstanceOptions(o) {
   linked_type = o.id;

   let min_value = Number($('#min_value' + linked_type).val());
   let max_value = Number($('#max_value' + linked_type).val());
   let precision_value = Number($('#precision_value' + linked_type).val());

   instance_list[linked_type].parameters.range['min'] = min_value;
   instance_list[linked_type].parameters.range['max'] = max_value;
   instance_list[linked_type].parameters.range['precision'] = precision_value;

   saveInstanceList();

   $('#options' + linked_type).popover('toggle');
}

function saveInstanceList() {
   $('#instance_json').val(JSON.stringify(instance_list));
}

function initPopovers() {
   let $popovers = $('[data-toggle="popover"]');

   $popovers.popover('destroy');

   $popovers.popover({
      selector: '.popover_instance',
      container: 'body',
      placement: 'top',
      html: true
   });

   $popovers.on('show.bs.popover', function () {
      let linked_type = $(this).attr('data-instance');
      let content = getInstanceOptions(linked_type);
      $('#options' + linked_type).attr('data-content', content);
   });
}

function closePopover(o) {
   linked_type = o.id;
   $('#options' + linked_type).popover('toggle');
}

function linkedObjectChaged(id, selected_object) {
   // Очищаем поле выбора привязанного свойства и подгружаем в него новые данные.
   $('#linked_property' + id).empty();
   $('#linked_property' + id).selectpicker('refresh');
   renderPropertySelectbox('linked_property' + id, selected_object);

   // Обновляем сведения о привязанном к метрике объекте.
   traits_list[id].linked_object = selected_object;

   // Свойство очищаем.
   traits_list[id].linked_property = '';

   saveTraitsList();
}

function linkedPropertyChaged(id, selected_property) {
   // Обновляем сведения о привязанном к метрике свойстве объекте.
   traits_list[id].linked_property = selected_property;
   // Если свойство не выбрано, то объект очищаем.
   if (selected_property === '') {
      traits_list[id].linked_object = '';
   }
   saveTraitsList();
}

function tryParseJSON(jsonString){
   try {
      var o = JSON.parse(jsonString);
      if (o && typeof o === 'object') return o;
   }
   catch (e) { }
   return false;
};

function escapeHtml(string) {
   var entityMap = {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;",
      "/": "&#x2F;",
      "`": "&#x60;",
      "=": "&#x3D;"
   };

   return String(string).replace(/[&<>"'`=\/]/g, function(s) {
      return entityMap[s];
   });
}
